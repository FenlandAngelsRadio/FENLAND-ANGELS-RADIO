<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Presenters & Team | Fenland Angels Radio</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site-nav.css?v=5"><script src="site-nav.js?v=6" defer></script><style>main{padding:70px 3.5vw}.hero h1{font-size:clamp(46px,6vw,76px);margin:10px 0}.hero span{color:#ff3138}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-top:35px}.card{padding:22px;border:1px solid #2d3037;border-radius:16px;background:#0d0f13}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:11px}.card p{color:#cfd2d9;line-height:1.6}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><header></header><main><section class="hero"><p class="eyebrow">ON AIR</p><h1>Presenters & <span>Team</span></h1><p class="lead">Meet the people behind Fenland Angels Radio.</p></section><section id="team" class="grid"><p>Team profiles will appear here.</p></section></main><footer><div><strong>© 2026 Bastone Major Group Ltd</strong><span>Fenland Angels Radio — The Sound of the Fens</span></div></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="events-config.js"></script><script>(async()=>{try{const db=supabase.createClient(FAR_EVENTS_CONFIG.SUPABASE_URL,FAR_EVENTS_CONFIG.SUPABASE_ANON_KEY),{data}=await db.from('far_team').select('*').eq('enabled',true).order('sort_order').order('name'),box=document.getElementById('team'),e=v=>String(v||'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]));if(data&&data.length)box.innerHTML=data.map(p=>'<article class="card">'+(p.image_url?'<img src="'+e(p.image_url)+'" alt="'+e(p.name)+'">':'')+'<h2>'+e(p.name)+'</h2><strong>'+e(p.role_title)+'</strong>'+(p.show_name?'<p>'+e(p.show_name)+'</p>':'')+'<p>'+e(p.bio)+'</p></article>').join('')}catch(e){console.error(e)}})();</script></body></html>
