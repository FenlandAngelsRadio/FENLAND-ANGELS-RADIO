<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Home | FAR Admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site-nav.css?v=5"><script src="site-nav.js?v=6" defer></script><style>
main{width:min(94vw,1100px);margin:auto;padding:145px 0 80px}.head{display:flex;justify-content:space-between;align-items:center}.back{color:#fff;text-decoration:none;border:1px solid #444;padding:10px 14px;border-radius:9px}.status,.panel{background:#0d0f13;border:1px solid #2d3037;border-radius:15px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;color:#d4aa47;font-weight:900;margin-bottom:6px}.field input,.field textarea{box-sizing:border-box;width:100%;padding:12px;border:1px solid #3b404a;border-radius:9px;background:#11141a;color:#fff}.field textarea{min-height:100px}.save{margin-top:18px;padding:12px 18px;border:0;border-radius:9px;background:#d71920;color:#fff;font-weight:900;cursor:pointer}.pkg{display:grid;grid-template-columns:1fr 110px 110px;gap:10px;margin:12px 0;padding:15px;border:1px solid #292e37;border-radius:12px}.pkg textarea,.pkg input{width:100%;box-sizing:border-box;padding:10px;background:#11141a;color:#fff;border:1px solid #3b404a;border-radius:8px}.pkg .wide{grid-column:1/-1}@media(max-width:700px){.grid,.pkg{grid-template-columns:1fr}.pkg .wide{grid-column:auto}.head{align-items:flex-start;flex-direction:column;gap:12px}}</style><link rel="stylesheet" href="admin-ui.css?v=1"></head><body><header></header><main><div class="head"><div><p class="eyebrow">FAR ADMIN</p><h1 id="contentTitle">Website Home</h1><p id="contentHelp">Change homepage information and station contact details. Use Pages to create an additional page.</p></div><a class="back" href="admin-dashboard.html">← Return to Admin Dashboard</a></div><div id="status" class="status">Checking FAR Admin access…</div><section id="cms" hidden><div id="content"></div><a id="advertEnquiries" class="back" href="admin-inbox.html?kind=advertising" hidden>View advertising enquiries</a><div class="panel" id="packagePanel" hidden><h2>Advertising Packages</h2><p>Saved packages appear on the Advertising page.</p><div id="packages"></div><button id="savePackages" class="save">Save packages</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="events-config.js"></script><script>
(async()=>{const cfg=FAR_EVENTS_CONFIG||{},client=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY),status=document.getElementById('status'),cms=document.getElementById('cms');const {data:{session}}=await client.auth.getSession();if(!session){location.href='admin-dashboard.html';return}const {data:admin}=await client.from('far_admins').select('role,permissions').eq('user_id',session.user.id).maybeSingle();const role=(admin?.role||'').toLowerCase(),perms=Array.isArray(admin?.permissions)?admin.permissions:[],management=['owner','deputy_manager'].includes(role);
const modes={home:{title:'Website Home',permission:'website_content',help:'Change homepage information and station contact details. Use Pages to create an additional page.'},advertising:{title:'Advertising',permission:'advertising',help:'Manage advertising information, packages and enquiries.'},sponsors:{title:'Sponsors',permission:'sponsors',help:'Change the sponsorship message shown on the Advertising page.'},vouchers:{title:'Vouchers',permission:'vouchers',help:'Change voucher information and the shop link.'}};
const mode=new URLSearchParams(location.search).get('module')||'home',m=modes[mode];if(!admin||!m||(!management&&!perms.includes(m.permission))){status.textContent='Your account cannot use this tool. Return to FAR Admin to choose an available tool.';return}
const canContent=management||perms.includes('website_content');cms.hidden=false;document.title=m.title+' | FAR Admin';document.getElementById('contentTitle').textContent=m.title;document.getElementById('contentHelp').textContent=m.help;status.textContent=canContent?'Saved text appears on the website automatically.':'You can view this text. The existing service requires Website Home permission to save shared website text; ask the station owner for access.';
document.getElementById('packagePanel').hidden=mode!=='advertising';document.getElementById('advertEnquiries').hidden=mode!=='advertising';
const {data:rows,error}=await client.from('far_site_content').select('*').order('section').order('sort_order');if(error){status.textContent='Website information could not be loaded. Please try again or contact the station owner.';return}const sections={};for(const r of rows){const belongs=mode==='home'?['Homepage','Station'].includes(r.section):mode==='vouchers'?r.section==='Vouchers':mode==='sponsors'?r.content_key==='sponsor_notice':r.section==='Advertising'&&r.content_key!=='sponsor_notice';if(belongs)(sections[r.section]??=[]).push(r)};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));document.getElementById('content').innerHTML=Object.entries(sections).map(([s,rs])=>'<div class="panel"><h2>'+esc(mode==='sponsors'?'Sponsorship message':s)+'</h2><div class="grid">'+rs.map(r=>'<div class="field"><label>'+esc(r.label)+'</label>'+(r.value_type==='textarea'?'<textarea data-key="'+esc(r.content_key)+'">'+esc(r.value)+'</textarea>':'<input data-key="'+esc(r.content_key)+'" type="'+(r.value_type==='email'?'email':r.value_type==='url'?'url':'text')+'" value="'+esc(r.value)+'">')+'</div>').join('')+'</div><button class="save" data-save="'+esc(s)+'">Save '+esc(mode==='sponsors'?'sponsorship message':s)+'</button></div>').join('');
document.querySelectorAll('[data-key]').forEach(el=>el.disabled=!canContent);document.querySelectorAll('[data-save]').forEach(b=>b.hidden=!canContent);document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{b.disabled=true;for(const el of b.closest('.panel').querySelectorAll('[data-key]')){const {error}=await client.from('far_site_content').update({value:el.value,updated_at:new Date().toISOString()}).eq('content_key',el.dataset.key);if(error){status.textContent=error.message;b.disabled=false;return}}status.textContent=b.dataset.save+' saved.';b.disabled=false});
if(mode!=='advertising')return;const {data:pkgs}=await client.from('far_ad_packages').select('*').order('sort_order');document.getElementById('packages').innerHTML=(pkgs||[]).map(p=>'<div class="pkg" data-id="'+p.id+'"><input aria-label="Package name" data-f="name" value="'+esc(p.name)+'"><input aria-label="Price (£)" data-f="price" type="number" step=".01" value="'+p.price+'"><input aria-label="Plays per day" data-f="plays_per_day" type="number" value="'+p.plays_per_day+'"><textarea class="wide" aria-label="Description" data-f="description">'+esc(p.description)+'</textarea><input class="wide" aria-label="What is included" data-f="includes" value="'+esc(p.includes)+'"><input class="wide" aria-label="Purchase link" data-f="buy_url" value="'+esc(p.buy_url||'')+'"></div>').join('');
document.getElementById('savePackages').onclick=async()=>{for(const box of document.querySelectorAll('.pkg')){const o={updated_at:new Date().toISOString()};box.querySelectorAll('[data-f]').forEach(x=>o[x.dataset.f]=['price','plays_per_day'].includes(x.dataset.f)?Number(x.value):x.value);const {error}=await client.from('far_ad_packages').update(o).eq('id',box.dataset.id);if(error){status.textContent=error.message;return}}status.textContent='Advertising packages saved.'};
})();</script></body></html>
