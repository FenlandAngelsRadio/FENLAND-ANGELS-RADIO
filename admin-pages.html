<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pages | FAR Admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site-nav.css?v=3"><script src="site-nav.js?v=3" defer></script><style>
main{width:min(94vw,1150px);margin:auto;padding:145px 0 80px}.top{display:flex;justify-content:space-between;gap:20px;align-items:center}.panel{background:#0d0f13;border:1px solid #2d3037;border-radius:15px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:block;color:#d4aa47;font-weight:900;margin-bottom:5px}input,textarea{box-sizing:border-box;width:100%;padding:11px;border:1px solid #3b404a;border-radius:8px;background:#11141a;color:#fff}textarea{min-height:100px}.full{grid-column:1/-1}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}button,.btnx{border:0;border-radius:8px;padding:11px 15px;background:#d71920;color:#fff;font-weight:900;cursor:pointer;text-decoration:none}.secondary{background:#252a33}.danger{background:#72141a}.row{padding:16px 0;border-bottom:1px solid #292e37}.row:last-child{border:0}.row h3{margin:0 0 5px}.muted{color:#aeb4bf}.badge{display:inline-block;padding:4px 7px;border-radius:6px;background:#252a33;font-size:12px}.image-tools{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.image-preview{display:none;max-width:360px;max-height:220px;object-fit:contain;border:1px solid #343944;border-radius:10px;margin-top:10px;background:#090b0e;padding:5px}.image-preview.show{display:block}.filepick{position:absolute;left:-9999px}.builder{margin-top:20px;padding-top:18px;border-top:1px solid #292e37}.block-row{padding:14px;margin:12px 0;border:1px solid #303540;border-radius:10px;background:#101319}.block-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.block-head strong{color:#d4aa47}.block-editor{display:none;margin-top:12px}.block-row.open .block-editor{display:block}.block-editor .grid{margin-top:8px}.small{font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}</style></head><body><header></header><main><div class="top"><div><p class="eyebrow">FAR WEBSITE CMS</p><h1>Pages Manager</h1><p>Create campaign, appeal and temporary pages without editing website code.</p></div><a class="btnx secondary" href="admin-dashboard.html">← Admin Dashboard</a></div><div id="status" class="panel">Checking access…</div><section id="app" hidden><div class="panel"><h2 id="formTitle">Add page</h2><input id="id" type="hidden"><div class="grid"><div><label>Page title</label><input id="title"></div><div><label>URL slug</label><input id="slug" placeholder="toy-appeal"></div><div><label>Eyebrow / category</label><input id="eyebrow" placeholder="FAR COMMUNITY"></div><div><label>Hero image</label><input id="hero_image" type="hidden"><input id="hero_file" class="filepick" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><div class="image-tools"><button id="chooseImage" type="button" class="secondary">Choose / Upload Image</button><button id="removeImage" type="button" class="danger" hidden>Remove Image</button><span id="imageState" class="muted">No image selected</span></div><img id="imagePreview" class="image-preview" alt="Hero image preview"></div><div class="full"><label>Short introduction</label><textarea id="summary"></textarea></div><div class="full"><label>Page content</label><textarea id="body" style="min-height:220px"></textarea></div><div><label>Button text</label><input id="button_text"></div><div><label>Button URL</label><input id="button_url"></div><div><label><input id="published" type="checkbox" style="width:auto" checked> Published / enabled</label></div><div><label><input id="show_in_navigation" type="checkbox" style="width:auto"> Show in website navigation</label></div><div><label>Navigation order</label><input id="sort_order" type="number" value="0"></div></div><div class="actions"><button id="save">Save page</button><button id="clear" class="secondary">Clear form</button></div><div id="blockBuilder" class="builder" hidden><h2>Page sections</h2><p class="muted">Build this page with reusable sections. Save the page first, then add sections.</p><div class="actions"><select id="newBlockType" style="padding:11px;background:#11141a;color:#fff;border:1px solid #3b404a;border-radius:8px"><option value="heading">Heading</option><option value="text">Text</option><option value="image">Image</option><option value="button">Button</option><option value="contact">Contact Details</option><option value="location">Location / Address</option><option value="dates">Dates / Times</option><option value="links">Links</option><option value="callout">Call to Action</option></select><button id="addBlock" type="button">+ Add Section</button></div><div id="blocks"></div></div></div><div class="panel"><h2>Current pages</h2><div id="list">Loading…</div></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="events-config.js"></script><script>
(async()=>{const cfg=FAR_EVENTS_CONFIG,db=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY),status=document.getElementById('status'),app=document.getElementById('app'),ids=['title','slug','eyebrow','summary','body','hero_image','button_text','button_url','sort_order'];const {data:{session}}=await db.auth.getSession();if(!session){location.href='admin-dashboard.html';return}const {data:a}=await db.from('far_admins').select('role').eq('user_id',session.user.id).maybeSingle();if(!a||!['owner','deputy_manager'].includes((a.role||'').toLowerCase())){status.textContent='Owner or deputy manager access required.';return}app.hidden=false;status.textContent='Pages Manager ready.';const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));
let currentBlocks=[];const blockLabels={heading:'Heading',text:'Text',image:'Image',button:'Button',contact:'Contact Details',location:'Location / Address',dates:'Dates / Times',links:'Links',callout:'Call to Action'};function blockEsc(v){return esc(v)}async function loadBlocks(){const pid=Number(id.value||0);blockBuilder.hidden=!pid;if(!pid){blocks.innerHTML='';return}const {data,error}=await db.from('far_page_blocks').select('*').eq('page_id',pid).order('sort_order').order('id');if(error){blocks.innerHTML='<p class="muted">Page sections database is not installed yet.</p>';return}currentBlocks=data||[];blocks.innerHTML=currentBlocks.map((b,i)=>'<div class="block-row" data-bid="'+b.id+'"><div class="block-head"><div><strong>'+blockEsc(blockLabels[b.block_type]||b.block_type)+'</strong> <span class="badge">'+(b.enabled?'ENABLED':'DISABLED')+'</span><div class="small muted">'+blockEsc(b.heading||b.content||'Empty section')+'</div></div><div class="actions"><button type="button" class="secondary" data-up="'+b.id+'">↑</button><button type="button" class="secondary" data-down="'+b.id+'">↓</button><button type="button" class="secondary" data-open="'+b.id+'">Edit</button><button type="button" class="secondary" data-enable="'+b.id+'">'+(b.enabled?'Disable':'Enable')+'</button><button type="button" class="danger" data-bdel="'+b.id+'">Delete</button></div></div><div class="block-editor"><div class="grid"><div><label>Heading / label</label><input data-field="heading" value="'+blockEsc(b.heading)+'"></div><div><label>Image URL (image sections)</label><input data-field="image_url" value="'+blockEsc(b.image_url||'')+'"></div><div class="full"><label>Content</label><textarea data-field="content">'+blockEsc(b.content)+'</textarea></div><div><label>Button / link text</label><input data-field="button_text" value="'+blockEsc(b.button_text||'')+'"></div><div><label>Button / link URL</label><input data-field="button_url" value="'+blockEsc(b.button_url||'')+'"></div></div><div class="actions"><button type="button" data-bsave="'+b.id+'">Save Section</button></div></div></div>').join('')||'<p class="muted">No sections yet. Choose a section type above.</p>';blocks.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>x.closest('.block-row').classList.toggle('open'));blocks.querySelectorAll('[data-bsave]').forEach(x=>x.onclick=async()=>{const row=x.closest('.block-row'),bid=x.dataset.bsave,o={updated_at:new Date().toISOString()};row.querySelectorAll('[data-field]').forEach(el=>o[el.dataset.field]=el.value.trim());const {error}=await db.from('far_page_blocks').update(o).eq('id',bid);status.textContent=error?error.message:'Section saved.';loadBlocks()});blocks.querySelectorAll('[data-enable]').forEach(x=>x.onclick=async()=>{const b=currentBlocks.find(z=>z.id==x.dataset.enable);await db.from('far_page_blocks').update({enabled:!b.enabled,updated_at:new Date().toISOString()}).eq('id',b.id);loadBlocks()});blocks.querySelectorAll('[data-bdel]').forEach(x=>x.onclick=async()=>{if(!confirm('Delete this section permanently?'))return;await db.from('far_page_blocks').delete().eq('id',x.dataset.bdel);loadBlocks()});async function move(bid,dir){const i=currentBlocks.findIndex(z=>z.id==bid),j=i+dir;if(i<0||j<0||j>=currentBlocks.length)return;const a=currentBlocks[i],b=currentBlocks[j];await db.from('far_page_blocks').update({sort_order:b.sort_order}).eq('id',a.id);await db.from('far_page_blocks').update({sort_order:a.sort_order}).eq('id',b.id);loadBlocks()}blocks.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>move(Number(x.dataset.up),-1));blocks.querySelectorAll('[data-down]').forEach(x=>x.onclick=()=>move(Number(x.dataset.down),1))}addBlock.onclick=async()=>{const pid=Number(id.value||0);if(!pid)return;const max=currentBlocks.reduce((m,b)=>Math.max(m,Number(b.sort_order||0)),0);const {error}=await db.from('far_page_blocks').insert({page_id:pid,block_type:newBlockType.value,sort_order:max+10});status.textContent=error?error.message:'Section added.';loadBlocks()};function setImage(url=''){hero_image.value=url;imagePreview.src=url||'';imagePreview.classList.toggle('show',!!url);removeImage.hidden=!url;imageState.textContent=url?'Image ready':'No image selected'}function clear(){document.getElementById('id').value='';ids.forEach(k=>document.getElementById(k).value=k==='sort_order'?0:'');published.checked=true;show_in_navigation.checked=false;formTitle.textContent='Add page';setImage('');hero_file.value='';blockBuilder.hidden=true;blocks.innerHTML=''} clear.onclick=clear;chooseImage.onclick=()=>hero_file.click();removeImage.onclick=()=>setImage('');hero_file.onchange=async()=>{const file=hero_file.files[0];if(!file)return;if(file.size>10485760){status.textContent='Image is too large. Maximum 10 MB.';hero_file.value='';return}imageState.textContent='Uploading image…';chooseImage.disabled=true;const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),name='pages/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext,{error}=await db.storage.from('far-cms-media').upload(name,file,{cacheControl:'3600',upsert:false});chooseImage.disabled=false;if(error){status.textContent='Image upload failed: '+error.message;imageState.textContent='Upload failed';return}const {data:u}=db.storage.from('far-cms-media').getPublicUrl(name);setImage(u.publicUrl);status.textContent='Image uploaded. Save the page to keep this image on the page.'};
async function load(){const {data,error}=await db.from('far_custom_pages').select('*').order('sort_order').order('title');if(error){status.textContent='Run the custom pages SQL setup first.';return}list.innerHTML=(data||[]).map(p=>'<div class="row"><h3>'+esc(p.title)+' <span class="badge">'+(p.published?'ENABLED':'DISABLED')+'</span></h3><div class="muted">/'+esc(p.slug)+' · '+(p.show_in_navigation?'shown in navigation':'not in navigation')+'</div><div class="actions"><a class="btnx secondary" target="_blank" href="page.html?slug='+encodeURIComponent(p.slug)+'">View</a><button class="secondary" data-edit="'+p.id+'">Edit</button><button class="secondary" data-toggle="'+p.id+'" data-state="'+p.published+'">'+(p.published?'Disable':'Enable')+'</button><button class="danger" data-del="'+p.id+'">Delete</button></div></div>').join('')||'<p>No custom pages yet.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=data.find(x=>x.id==b.dataset.edit);id.value=p.id;ids.forEach(k=>document.getElementById(k).value=p[k]??'');setImage(p.hero_image||'');published.checked=p.published;show_in_navigation.checked=p.show_in_navigation;formTitle.textContent='Edit '+p.title;loadBlocks();scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{await db.from('far_custom_pages').update({published:b.dataset.state!=='true',updated_at:new Date().toISOString()}).eq('id',b.dataset.toggle);load()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this page permanently?'))return;await db.from('far_custom_pages').delete().eq('id',b.dataset.del);load()})}
save.onclick=async()=>{const slugVal=slug.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g,'-').replace(/^-|-$/g,'');if(!title.value.trim()||!slugVal){status.textContent='Page title and URL slug are required.';return}const o={slug:slugVal,published:published.checked,show_in_navigation:show_in_navigation.checked,updated_at:new Date().toISOString()};ids.forEach(k=>o[k]=k==='sort_order'?Number(document.getElementById(k).value||0):document.getElementById(k).value.trim());delete o.slug;o.slug=slugVal;const q=id.value?db.from('far_custom_pages').update(o).eq('id',id.value):db.from('far_custom_pages').insert(o),{error}=await q;if(error){status.textContent=error.message;return}status.textContent='Page saved.';if(!id.value){const {data:newp}=await db.from('far_custom_pages').select('id').eq('slug',slugVal).maybeSingle();if(newp){id.value=newp.id;formTitle.textContent='Edit '+title.value;loadBlocks()}}else{loadBlocks()}load()};await load()})();</script></body></html>
