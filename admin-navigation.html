<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navigation Manager | FAR Admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site-nav.css?v=3"><script src="site-nav.js?v=4" defer></script><style>
main{width:min(94vw,1150px);margin:auto;padding:145px 0 80px}.top{display:flex;justify-content:space-between;align-items:center;gap:18px}.panel{background:#0d0f13;border:1px solid #2d3037;border-radius:15px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#d4aa47;font-weight:900;margin:5px 0}input,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #3b404a;border-radius:8px;background:#11141a;color:#fff}.full{grid-column:1/-1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}button,.back{border:0;border-radius:8px;padding:11px 15px;background:#252a33;color:#fff;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:#d71920}.danger{background:#72141a}.row{padding:15px 0;border-bottom:1px solid #292e37;display:grid;grid-template-columns:1fr 160px 120px 220px;gap:12px;align-items:center}.row:last-child{border:0}.muted{color:#aeb4bf}.badge{font-size:12px;background:#252a33;padding:4px 7px;border-radius:6px}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.full{grid-column:auto}}</style></head><body><header></header><main><div class="top"><div><p class="eyebrow">FAR WEBSITE CMS</p><h1>Navigation Manager</h1><p>Control labels, order, destinations and visibility of the website navigation.</p></div><a class="back" href="admin-dashboard.html">← Admin Dashboard</a></div><div id="status" class="panel">Checking access…</div><section id="app" hidden><div class="panel"><h2 id="formTitle">Add navigation item</h2><input id="id" type="hidden"><div class="grid"><div><label>Navigation label</label><input id="label"></div><div><label>Destination URL</label><input id="href" placeholder="about-team.html"></div><div><label>Menu</label><select id="location"><option value="main">Main navigation</option><option value="news">News & Weather</option><option value="community">Community</option><option value="on_air">On Air</option></select></div><div><label>Order</label><input id="sort_order" type="number" value="10"></div><div><label><input id="enabled" type="checkbox" checked style="width:auto"> Enabled</label></div></div><div class="actions"><button id="save" class="primary">Save item</button><button id="clear">Clear form</button></div></div><div class="panel"><h2>Current navigation</h2><div id="list">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="events-config.js"></script><script>
(async()=>{const cfg=FAR_EVENTS_CONFIG||{},db=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY),status=document.getElementById('status'),app=document.getElementById('app'),$=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const {data:{session}}=await db.auth.getSession();if(!session){location.href='admin-dashboard.html';return}const {data:a}=await db.from('far_admins').select('role,permissions').eq('user_id',session.user.id).maybeSingle();const role=(a?.role||'').toLowerCase(),perms=Array.isArray(a?.permissions)?a.permissions:[];if(!a||(!['owner','deputy_manager'].includes(role)&&!perms.includes('navigation'))){status.textContent='You do not have Navigation permission.';return}app.hidden=false;status.textContent='Navigation Manager ready.';let rows=[];function reset(){id.value='';label.value='';href.value='';location.value='main';sort_order.value=10;enabled.checked=true;formTitle.textContent='Add navigation item'}async function load(){const {data,error}=await db.from('far_navigation_items').select('*').order('location').order('sort_order').order('id');if(error){status.textContent='Run FAR-NAVIGATION-SETUP.sql in Supabase first.';return}rows=data||[];list.innerHTML=rows.map(r=>'<div class="row"><div><strong>'+esc(r.label)+'</strong><br><span class="muted">'+esc(r.href)+'</span></div><div>'+esc(r.location.replace('_',' '))+'</div><div><span class="badge">'+(r.enabled?'ENABLED':'DISABLED')+'</span></div><div class="actions"><button data-edit="'+r.id+'">Edit</button><button data-toggle="'+r.id+'">'+(r.enabled?'Disable':'Enable')+'</button>'+(r.system_key?'':'<button class="danger" data-del="'+r.id+'">Delete</button>')+'</div></div>').join('')||'<p class="muted">No navigation items.</p>';list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id==b.dataset.edit);id.value=r.id;label.value=r.label;href.value=r.href;location.value=r.location;sort_order.value=r.sort_order;enabled.checked=r.enabled;formTitle.textContent='Edit navigation item';scrollTo({top:0,behavior:'smooth'})});list.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const r=rows.find(x=>x.id==b.dataset.toggle);await db.from('far_navigation_items').update({enabled:!r.enabled,updated_at:new Date().toISOString()}).eq('id',r.id);load()});list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this custom navigation item?'))return;await db.from('far_navigation_items').delete().eq('id',b.dataset.del);load()})}save.onclick=async()=>{if(!label.value.trim()||!href.value.trim()){status.textContent='Label and destination are required.';return}const o={label:label.value.trim(),href:href.value.trim(),location:location.value,sort_order:Number(sort_order.value)||0,enabled:enabled.checked,updated_at:new Date().toISOString()};const q=id.value?db.from('far_navigation_items').update(o).eq('id',id.value):db.from('far_navigation_items').insert(o);const {error}=await q;if(error){status.textContent=error.message;return}status.textContent='Navigation item saved.';reset();load()};clear.onclick=reset;reset();load()})();
</script></body></html>
