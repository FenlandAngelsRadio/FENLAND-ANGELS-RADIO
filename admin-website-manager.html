<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Manager | FAR Admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site-nav.css?v=3"><script src="site-nav.js?v=3" defer></script><style>
main{width:min(94vw,1150px);margin:auto;padding:145px 0 80px}.panel{background:#0d0f13;border:1px solid #2d3037;border-radius:15px;padding:20px;margin:18px 0}.tabs,.actions{display:flex;gap:9px;flex-wrap:wrap}.tabs button,.actions button,.btn{border:0;border-radius:8px;padding:11px 14px;background:#252a33;color:#fff;font-weight:900;cursor:pointer;text-decoration:none}.tabs button.active,.actions .primary{background:#d71920}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#d4aa47;font-weight:900;margin:5px 0}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #3b404a;border-radius:8px;background:#11141a;color:#fff}textarea{min-height:110px}.full{grid-column:1/-1}.row{padding:15px 0;border-bottom:1px solid #292e37}.row h3{margin:0 0 5px}.muted{color:#aeb4bf}.badge{font-size:12px;background:#252a33;padding:4px 7px;border-radius:6px}.danger{background:#72141a!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><header></header><main><p class="eyebrow">FAR WEBSITE CMS</p><h1>Website Manager</h1><p>Manage podcasts, listening platforms, the public file and presenter/team profiles.</p><a class="btn" href="admin-dashboard.html">← Admin Dashboard</a><div id="status" class="panel">Checking access…</div><section id="app" hidden><div class="tabs" id="tabs"></div><div class="panel"><h2 id="formTitle">Add item</h2><input id="rid" type="hidden"><div id="fields" class="grid"></div><div class="actions"><button id="save" class="primary">Save</button><button id="clear">Clear</button></div></div><div class="panel"><h2 id="listTitle">Current items</h2><div id="list">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="events-config.js"></script><script>
(async()=>{const db=supabase.createClient(FAR_EVENTS_CONFIG.SUPABASE_URL,FAR_EVENTS_CONFIG.SUPABASE_ANON_KEY),status=document.getElementById('status'),app=document.getElementById('app');const {data:{session}}=await db.auth.getSession();if(!session){location.href='admin-dashboard.html';return}const {data:a}=await db.from('far_admins').select('role,permissions').eq('user_id',session.user.id).maybeSingle(),role=(a?.role||'').toLowerCase(),perms=Array.isArray(a?.permissions)?a.permissions:[],mgmt=['owner','deputy_manager'].includes(role);
const mods={podcasts:{label:'Podcasts',permission:'podcasts',table:'far_podcasts',fields:[['title','Title'],['presenter','Presenter / show'],['description','Description','textarea'],['artwork_url','Artwork image URL'],['audio_url','Audio URL'],['link_url','External / episode link'],['published_at','Publish date/time','datetime-local'],['sort_order','Order','number'],['enabled','Published / enabled','checkbox']]},listen:{label:'Listen Platforms',permission:'listen_platforms',table:'far_listen_platforms',fields:[['title','Platform name'],['description','Description','textarea'],['icon','Icon / emoji'],['button_text','Button text'],['button_url','Button URL'],['sort_order','Order','number'],['enabled','Enabled','checkbox']]},public:{label:'Public File',permission:'public_file',table:'far_public_file_sections',fields:[['heading','Section heading'],['content','Section content','textarea'],['sort_order','Order','number'],['enabled','Enabled','checkbox']]},team:{label:'Presenters / Team',permission:'presenters',table:'far_team',fields:[['name','Name'],['role_title','Role'],['show_name','Show / programme'],['bio','Biography','textarea'],['image_url','Profile image URL'],['sort_order','Order','number'],['enabled','Published / enabled','checkbox']]}};
const allowed=Object.entries(mods).filter(([k,m])=>mgmt||perms.includes(m.permission));if(!allowed.length){status.textContent='You do not have access to these website managers.';return}app.hidden=false;status.textContent='Website Manager ready.';let key=(new URLSearchParams(location.search).get('module'));if(!allowed.some(([k])=>k===key))key=allowed[0][0];let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));
tabs.innerHTML=allowed.map(([k,m])=>'<button data-tab="'+k+'">'+m.label+'</button>').join('');tabs.onclick=e=>{if(e.target.dataset.tab){key=e.target.dataset.tab;renderForm();load()}};
function renderForm(row={}){const m=mods[key];formTitle.textContent=(row.id?'Edit ':'Add ')+m.label.replace(/s$/,'');rid.value=row.id||'';fields.innerHTML=m.fields.map(([n,l,t='text'])=>{if(t==='checkbox')return '<div><label><input data-f="'+n+'" type="checkbox" style="width:auto" '+(row[n]!==false?'checked':'')+'> '+l+'</label></div>';if(t==='textarea')return '<div class="full"><label>'+l+'</label><textarea data-f="'+n+'">'+esc(row[n]||'')+'</textarea></div>';let val=row[n]??(t==='number'?0:'');if(t==='datetime-local'&&val)val=String(val).slice(0,16);return '<div><label>'+l+'</label><input data-f="'+n+'" type="'+t+'" value="'+esc(val)+'"></div>'}).join('');[...tabs.children].forEach(b=>b.classList.toggle('active',b.dataset.tab===key))}
function obj(){const o={updated_at:new Date().toISOString()};fields.querySelectorAll('[data-f]').forEach(x=>o[x.dataset.f]=x.type==='checkbox'?x.checked:x.type==='number'?Number(x.value||0):x.value.trim());return o}
async function load(){renderForm();const m=mods[key],{data,error}=await db.from(m.table).select('*').order('sort_order').order('id');if(error){status.textContent='Database setup required: '+error.message;list.innerHTML='';return}rows=data||[];listTitle.textContent='Current '+m.label;list.innerHTML=rows.map(r=>'<div class="row"><h3>'+esc(r.title||r.heading||r.name)+' <span class="badge">'+(r.enabled?'ENABLED':'DISABLED')+'</span></h3><div class="muted">'+esc(r.description||r.role_title||r.content||'')+'</div><div class="actions"><button data-edit="'+r.id+'">Edit</button><button data-toggle="'+r.id+'">'+(r.enabled?'Disable':'Enable')+'</button><button class="danger" data-del="'+r.id+'">Delete</button></div></div>').join('')||'<p class="muted">No items yet.</p>';list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id==b.dataset.edit);renderForm(r);scrollTo({top:0,behavior:'smooth'})});list.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const r=rows.find(x=>x.id==b.dataset.toggle);await db.from(m.table).update({enabled:!r.enabled,updated_at:new Date().toISOString()}).eq('id',r.id);load()});list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this item permanently?'))return;await db.from(m.table).delete().eq('id',b.dataset.del);load()})}
save.onclick=async()=>{const m=mods[key],o=obj();if(!Object.values(o).some(v=>typeof v==='string'&&v)){status.textContent='Enter the item details first.';return}const q=rid.value?db.from(m.table).update(o).eq('id',rid.value):db.from(m.table).insert(o),{error}=await q;if(error){status.textContent=error.message;return}status.textContent='Saved successfully.';renderForm();load()};clear.onclick=()=>renderForm();renderForm();load()})();
</script></body></html>
