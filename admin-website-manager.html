<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website Manager | FAR Admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site-nav.css?v=4"><script src="site-nav.js?v=5" defer></script><style>
main{width:min(94vw,1150px);margin:auto;padding:145px 0 80px}.panel{background:#0d0f13;border:1px solid #2d3037;border-radius:15px;padding:20px;margin:18px 0}.tabs,.actions{display:flex;gap:9px;flex-wrap:wrap}.tabs button,.actions button,.btn{border:0;border-radius:8px;padding:11px 14px;background:#252a33;color:#fff;font-weight:900;cursor:pointer;text-decoration:none}.tabs button.active,.actions .primary{background:#d71920}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;color:#d4aa47;font-weight:900;margin:5px 0}input,textarea,select{box-sizing:border-box;width:100%;padding:11px;border:1px solid #3b404a;border-radius:8px;background:#11141a;color:#fff}textarea{min-height:110px}.full{grid-column:1/-1}.row{padding:15px 0;border-bottom:1px solid #292e37}.row h3{margin:0 0 5px}.muted{color:#aeb4bf}.badge{font-size:12px;background:#252a33;padding:4px 7px;border-radius:6px}.danger{background:#72141a!important}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><link rel="stylesheet" href="admin-ui.css?v=1"></head><body><header></header><main><p class="eyebrow">FAR ADMIN</p><h1 id="managerTitle">Website</h1><p id="managerHelp"></p><a class="btn" href="admin-dashboard.html">← Return to Admin Dashboard</a><div id="status" class="panel">Checking access…</div><section id="app" hidden><div class="tabs" id="tabs"></div><div class="panel"><h2 id="formTitle">Add item</h2><input id="rid" type="hidden"><div id="fields" class="grid"></div><div class="actions"><button id="save" class="primary">Save</button><button id="clear">Clear</button></div></div><div class="panel"><h2 id="listTitle">Current items</h2><div id="list">Loading…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="events-config.js"></script><script src="admin-media.js?v=1"></script><script>
(async()=>{const $=id=>document.getElementById(id),[tabs,formTitle,rid,fields,listTitle,list,save,clear]=['tabs','formTitle','rid','fields','listTitle','list','save','clear'].map($);const db=supabase.createClient(FAR_EVENTS_CONFIG.SUPABASE_URL,FAR_EVENTS_CONFIG.SUPABASE_ANON_KEY),status=document.getElementById('status'),app=document.getElementById('app');const {data:{session}}=await db.auth.getSession();if(!session){location.href='admin-dashboard.html';return}const {data:a}=await db.from('far_admins').select('role,permissions').eq('user_id',session.user.id).maybeSingle(),role=(a?.role||'').toLowerCase(),perms=Array.isArray(a?.permissions)?a.permissions:[],mgmt=['owner','deputy_manager'].includes(role);
const mods={podcasts:{label:'Podcasts',permission:'podcasts',table:'far_podcasts',fields:[['title','Title'],['presenter','Presenter / show'],['description','Description','textarea'],['artwork_url','Episode artwork'],['audio_url','Hosted audio link'],['link_url','External / episode link'],['published_at','Publish date/time','datetime-local'],['sort_order','Display position (lower numbers first)','number'],['enabled','Published','checkbox']]},listen:{label:'Listen Platforms',permission:'listen_platforms',table:'far_listen_platforms',fields:[['title','Platform name'],['description','Description','textarea'],['icon','Icon / emoji'],['button_text','Button text'],['button_url','Button URL'],['sort_order','Display position (lower numbers first)','number'],['enabled','Show on website','checkbox']]},public:{label:'Public File',permission:'public_file',table:'far_public_file_sections',fields:[['heading','Section heading'],['content','Section content','textarea'],['sort_order','Display position (lower numbers first)','number'],['enabled','Show on website','checkbox']]},team:{label:'Presenters & Team',permission:'presenters',table:'far_team',fields:[['name','Name'],['role_title','Role'],['show_name','Show / programme'],['bio','Biography','textarea'],['image_url','Profile photo'],['sort_order','Display position (lower numbers first)','number'],['enabled','Published','checkbox']]}};
const allowed=Object.entries(mods).filter(([k,m])=>mgmt||perms.includes(m.permission));if(!allowed.length){status.textContent='You do not have access to these website managers.';return}app.hidden=false;status.textContent='Choose an item below to edit, or add a new one.';const requested=new URLSearchParams(location.search).get('module');if(requested&&!allowed.some(([k])=>k===requested)){app.hidden=true;status.textContent='Your account cannot use this tool. Return to FAR Admin to choose an available tool.';return}let key=requested||allowed[0][0],rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));
tabs.hidden=true;tabs.style.display='none';tabs.innerHTML=allowed.map(([k,m])=>'<button data-tab="'+k+'">'+m.label+'</button>').join('');tabs.onclick=e=>{if(e.target.dataset.tab){key=e.target.dataset.tab;renderForm();load()}};
async function change(query,message){const {error}=await query;if(error){status.textContent='This change could not be saved. Please try again or contact the station owner.';return false}status.textContent=message;return true}function renderForm(row={}){const m=mods[key];document.title=m.label+' | FAR Admin';document.getElementById('managerTitle').textContent=m.label;document.getElementById('managerHelp').textContent={podcasts:'Add and publish podcast episodes. Saved published episodes appear on the Podcasts page.',listen:'Change the listening options and links shown on Other Ways to Listen. Saved visible options appear on the website.',public:'Update official station information. Saved visible sections appear on the Public File page.',team:'Manage presenter and team profiles. Saved published profiles appear on Presenters & Team.'}[key];formTitle.textContent=(row.id?'Edit ':'Add ')+({podcasts:'podcast episode',listen:'listening option',public:'public file section',team:'team member'}[key]);rid.value=row.id||'';fields.innerHTML=m.fields.map(([n,l,t='text'])=>{if(t==='checkbox')return '<div><label><input aria-label="'+l+'" data-f="'+n+'" type="checkbox" style="width:auto" '+(row[n]!==false?'checked':'')+'> '+l+'</label></div>';if(t==='textarea')return '<div class="full"><label>'+l+'</label><textarea aria-label="'+l+'" data-f="'+n+'">'+esc(row[n]||'')+'</textarea></div>';let val=row[n]??(t==='number'?0:'');if(t==='datetime-local'&&val){const date=new Date(val);val=new Date(date.getTime()-date.getTimezoneOffset()*60000).toISOString().slice(0,16)};return '<div><label>'+l+'</label><input aria-label="'+l+'" data-f="'+n+'" type="'+t+'" value="'+esc(val)+'"></div>'}).join('');fields.querySelectorAll('[data-f="artwork_url"],[data-f="image_url"]').forEach(input=>FARMedia.attach(input,{db,role,folder:key,saveButtons:[save,clear],saveLabel:'Save',label:key==='team'?'profile photo':'artwork'}));const audio=fields.querySelector('[data-f="audio_url"]');if(audio){const help=document.createElement('p');help.className='muted';help.textContent='Paste the direct audio link from your podcast host. This website currently uploads images only.';audio.after(help)};[...tabs.children].forEach(b=>b.classList.toggle('active',b.dataset.tab===key))}
function obj(){const o={updated_at:new Date().toISOString()};fields.querySelectorAll('[data-f]').forEach(x=>o[x.dataset.f]=x.type==='checkbox'?x.checked:x.type==='number'?Number(x.value||0):x.type==='datetime-local'?(x.value?new Date(x.value).toISOString():null):x.value.trim());return o}
async function load(){renderForm();const m=mods[key],{data,error}=await db.from(m.table).select('*').order('sort_order').order('id');if(error){status.textContent='This content could not be loaded. Please try again or contact the station owner.';list.innerHTML='';return}rows=data||[];listTitle.textContent='Current '+m.label;list.innerHTML=rows.map(r=>'<div class="row"><h3>'+esc(r.title||r.heading||r.name)+' <span class="badge">'+(r.enabled?'ENABLED':'DISABLED')+'</span></h3><div class="muted">'+esc(r.description||r.role_title||r.content||'')+'</div><div class="actions"><button data-edit="'+r.id+'">Edit</button><button data-toggle="'+r.id+'">'+(r.enabled?'Disable':'Enable')+'</button><button class="danger" data-del="'+r.id+'">Delete</button></div></div>').join('')||'<p class="muted">No items yet.</p>';list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const r=rows.find(x=>x.id==b.dataset.edit);renderForm(r);scrollTo({top:0,behavior:'smooth'})});list.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const r=rows.find(x=>x.id==b.dataset.toggle);if(await change(db.from(m.table).update({enabled:!r.enabled,updated_at:new Date().toISOString()}).eq('id',r.id),'Visibility saved.'))load()});list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this item permanently?'))return;if(await change(db.from(m.table).delete().eq('id',b.dataset.del),'Item deleted.'))load()})}
save.onclick=async()=>{const m=mods[key],o=obj();if(!(o.title||o.heading||o.name)){status.textContent='Enter the item details first.';return}const q=rid.value?db.from(m.table).update(o).eq('id',rid.value):db.from(m.table).insert(o),{error}=await q;if(error){status.textContent=error.message;return}status.textContent='Saved successfully.';renderForm();load()};clear.onclick=()=>renderForm();renderForm();load()})();
</script></body></html>
