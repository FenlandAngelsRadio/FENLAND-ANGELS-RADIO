<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fenland Angels Radio</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site-nav.css?v=5"><script src="site-nav.js?v=6" defer></script><style>main{width:min(92vw,1050px);margin:auto;padding:145px 0 90px}.hero{padding:38px;border:1px solid #5b4520;border-radius:20px;background:#0d0f13}.hero img{display:block;max-width:100%;max-height:500px;margin:25px auto;border-radius:14px}.hero h1{font-size:clamp(40px,6vw,72px);margin:8px 0 16px}.summary{font-size:20px;color:#d3d7df;line-height:1.6}.body{margin-top:30px;white-space:pre-wrap;line-height:1.75;font-size:17px}.cta{display:inline-block;margin-top:28px;padding:13px 18px;background:#d71920;color:#fff;border-radius:9px;text-decoration:none;font-weight:900}.blocks{margin-top:35px}.cms-block{padding:24px 0;border-top:1px solid #292e37}.cms-block h2{font-size:32px;margin:0 0 12px}.cms-block p{white-space:pre-wrap;line-height:1.75}.cms-block img{display:block;max-width:100%;max-height:600px;margin:12px auto;border-radius:12px}.cms-contact,.cms-location,.cms-dates,.cms-callout{padding:22px;border:1px solid #343944;border-radius:12px;background:#11141a}.cms-callout{border-color:#6a5427}</style></head><body><header></header><main id="main"><p>Loading…</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="events-config.js"></script><script>(async()=>{const slug=new URLSearchParams(location.search).get('slug'),db=supabase.createClient(FAR_EVENTS_CONFIG.SUPABASE_URL,FAR_EVENTS_CONFIG.SUPABASE_ANON_KEY),{data:p}=await db.from('far_custom_pages').select('*').eq('slug',slug||'').maybeSingle(),m=document.getElementById('main'),esc=v=>String(v??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]));if(!p||!p.published){m.innerHTML='<div class="hero"><h1>Page unavailable</h1><p>This page is not currently published.</p></div>';return}document.title=p.title+' | Fenland Angels Radio';m.innerHTML='<article class="hero">'+(p.eyebrow?'<p class="eyebrow">'+esc(p.eyebrow)+'</p>':'')+'<h1>'+esc(p.title)+'</h1>'+(p.summary?'<p class="summary">'+esc(p.summary)+'</p>':'')+(p.hero_image?'<img src="'+esc(p.hero_image)+'" alt="'+esc(p.title)+'">':'')+(p.body?'<div class="body">'+esc(p.body)+'</div>':'')+(p.button_text&&p.button_url?'<a class="cta" href="'+esc(p.button_url)+'">'+esc(p.button_text)+'</a>':'')+'<div id="cmsBlocks" class="blocks"></div></article>';const {data:bs}=await db.from('far_page_blocks').select('*').eq('page_id',p.id).eq('enabled',true).order('sort_order').order('id');const box=document.getElementById('cmsBlocks');if(box&&bs){box.innerHTML=bs.map(b=>{const h=b.heading?'<h2>'+esc(b.heading)+'</h2>':'';if(b.block_type==='links'){const links=String(b.content||'').split('\n').filter(Boolean).map(line=>{const parts=line.split('|'),label=parts[0].trim(),href=(parts[1]||parts[0]).trim();try{const url=new URL(href,location.href);return ['http:','https:'].includes(url.protocol)?'<p><a href="'+esc(url.href)+'">'+esc(label)+'</a></p>':''}catch(_){return ''}}).join('');return '<section class="cms-block">'+h+links+'</section>'}if(b.block_type==='image')return '<section class="cms-block">'+h+(b.image_url?'<img src="'+esc(b.image_url)+'" alt="'+esc(b.heading||p.title)+'">':'')+(b.content?'<p>'+esc(b.content)+'</p>':'')+'</section>';if(b.block_type==='button')return '<section class="cms-block">'+h+(b.button_text&&b.button_url?'<a class="cta" href="'+esc(b.button_url)+'">'+esc(b.button_text)+'</a>':'')+'</section>';const cls=['contact','location','dates','callout'].includes(b.block_type)?' cms-'+b.block_type:'';return '<section class="cms-block'+cls+'">'+h+(b.content?'<p>'+esc(b.content)+'</p>':'')+(b.button_text&&b.button_url?'<a class="cta" href="'+esc(b.button_url)+'">'+esc(b.button_text)+'</a>':'')+'</section>'}).join('')}})();</script></body></html>
