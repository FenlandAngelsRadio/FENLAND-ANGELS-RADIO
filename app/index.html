<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fenland Angels">
<title>Fenland Angels Radio</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css?v=11">
</head>
<body>
<main class="app">
  <header class="brand">
    <img src="./fenland-angels-radio-logo.jpg" alt="Fenland Angels Radio">
    <div>
      <strong>FENLAND <span>ANGELS</span> RADIO</strong>
      <small>THE SOUND OF THE FENS</small>
    </div>
  </header>

  <section class="player">
    <div class="status"><i></i> ON AIR</div>
    <h1>Listen Live</h1>
    <p>Independent Music Radio Community</p>

    <button id="play" class="play" type="button" aria-label="Play live radio">▶</button>

    <div class="state">
      <span id="state">Tap play to listen live</span>
      <b>320 kbps</b>
    </div>

    <div class="volume">
      <span>🔊</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
    </div>

    <div class="listener-hours">HOURS LISTENED TO FAR <strong id="farLifetimeHours">300.6</strong></div>

    <div class="now">
      <small>NOW PLAYING</small>
      <strong>Fenland Angels Radio</strong>
      <span>Live from The Fens</span>
    </div>
  </section>

  <a class="website" href="https://fenlandangelsradio.github.io/FENLAND-ANGELS-RADIO/" target="_blank" rel="noopener">Visit full website</a>
  <button id="installApp" class="website" type="button">📱 Install App</button>
<p id="installHint" class="hint">Install Fenland Angels Radio on your device.</p>

  <audio id="radio" preload="none" playsinline>
    <source src="https://hq3.yesstreaming.net/fenlandangelsradio/stream" type="audio/mpeg">
  </audio>
</main>
<script src="../events-config.js?v=11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../far-analytics.js?v=11"></script>
<script>
(function(){const BASE=300.62,SINCE="2026-09-29T22:18:59.24036Z";async function update(){try{const cfg=window.FAR_EVENTS_CONFIG||{};if(!window.supabase||!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY)return;const db=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const {data,error}=await db.from("far_icecast_snapshots").select("created_at,listeners").gte("created_at",SINCE).order("created_at",{ascending:true}).limit(10000);if(error||!data)return;let h=0;for(let i=0;i<data.length;i++){const st=new Date(data[i].created_at).getTime(),nx=i+1<data.length?new Date(data[i+1].created_at).getTime():Math.min(Date.now(),st+300000);h+=Number(data[i].listeners||0)*Math.max(0,Math.min(300000,nx-st))/3600000}document.getElementById("farLifetimeHours").textContent=(BASE+h).toLocaleString("en-GB",{minimumFractionDigits:1,maximumFractionDigits:1})}catch(e){}}update();setInterval(update,30000)})();
</script>
<script src="./app.js?v=11"></script>
</body>
</html>
