<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fenland Angels">
<title>Fenland Angels Radio</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css?v=11">
<link rel="stylesheet" href="../live-player.css?v=1">
<link rel="stylesheet" href="../unified-player.css?v=2">
</head>
<body>
<main class="app">


  <section class="far-unified-player" aria-label="Fenland Angels Radio live player">
  <div class="far-unified-programme">
    <span class="far-unified-show-label">CURRENTLY ON AIR</span>
    <h2 id="currentShowName">Fenland Angels Radio</h2>
    <div class="far-unified-art"><img id="currentShowImage" src="../fenland-angels-radio-logo.jpg" alt="Fenland Angels Radio programme artwork"></div>
    <span id="currentShowTime">View the programme schedule</span>
    <a class="far-unified-schedule" href="../schedule.html">Full schedule ↗</a>
  </div>
  <div class="far-unified-controls">
    <img class="far-unified-mark" src="../fenland-angels-radio-logo.jpg" alt="Fenland Angels Radio logo">
    <h1 class="far-unified-station">Fenland Angels Radio</h1>
    <div class="far-unified-volume"><button id="playerMute" type="button" aria-label="Mute audio" aria-pressed="false">♪</button><label for="volume" class="far-visually-hidden">Volume</label><input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"><output id="volumePercent" for="volume">80%</output></div>
    <div class="far-unified-listen"><button id="play" type="button" aria-label="Play Fenland Angels Radio" aria-pressed="false">▶</button><span class="far-unified-live"><i aria-hidden="true"></i> LIVE</span></div>
    <div id="state" role="status" aria-live="polite">Tap play to listen live</div>
    <span class="far-unified-quality">Live stream · 320 kbps</span>
  </div>
  
</section>

  <a class="website" href="https://fenlandangelsradio.co.uk/" target="_blank" rel="noopener">Visit full website</a>
  <button id="installApp" class="website" type="button">📱 Install App</button>
<p id="installHint" class="hint">Install Fenland Angels Radio on your device.</p>

  <audio id="radio" preload="none" playsinline>
    <source src="https://hq3.yesstreaming.net/fenlandangelsradio/stream" type="audio/mpeg">
  </audio>
</main>
<script src="../events-config.js?v=11"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../far-analytics.js?v=13"></script>

<script src="../far-cms.js?v=1"></script>
<script src="../unified-player.js?v=2" defer></script>
<script src="./app.js?v=17"></script>
<script src="../player-audio.js?v=1"></script>
</body>
</html>
