<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fenland Angels">
<title>Fenland Angels Radio</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
<main class="app">
  <header class="brand">
    <img src="./fenland-angels-radio-logo.jpg" alt="Fenland Angels Radio">
    <div>
      <strong>FENLAND <span>ANGELS</span> RADIO</strong>
      <small>THE SOUND OF THE FENS</small>
    </div>
  </header>

  <section class="player">
    <div class="status"><i></i> ON AIR</div>
    <h1>Listen Live</h1>
    <p>Independent Music Radio Community</p>

    <button id="play" class="play" type="button" aria-label="Play live radio">▶</button>

    <div class="state">
      <span id="state">Tap play to listen live</span>
      <b>320 kbps</b>
    </div>

    <div class="volume">
      <span>🔊</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8">
    </div>

    <div class="now">
      <small>NOW PLAYING</small>
      <strong>Fenland Angels Radio</strong>
      <span>Live from The Fens</span>
    </div>
  </section>

  <a class="website" href="https://fenlandangelsradio.github.io/FENLAND-ANGELS-RADIO/" target="_blank" rel="noopener">Visit full website</a>
  <p class="hint">Install this page to your Home Screen for the compact radio app.</p>

  <audio id="radio" preload="none" playsinline>
    <source src="https://ec5.yesstreaming.net:2620/stream" type="audio/mpeg">
  </audio>
</main>
<script src="./app.js?v=3"></script>
</body>
</html>
