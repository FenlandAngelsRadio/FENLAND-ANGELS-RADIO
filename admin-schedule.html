<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule | FAR Admin</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site-nav.css?v=3"><script src="site-nav.js?v=5" defer></script><style>
.cms{width:min(94vw,1200px);margin:auto;padding:130px 0 70px;color:#fff}.top{display:flex;justify-content:space-between;gap:18px;align-items:end}.back{color:#fff;text-decoration:none;border:1px solid #3a3f49;border-radius:9px;padding:10px 14px}.box{background:#0d0f13;border:1px solid #303640;border-radius:16px;padding:20px;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid label{font-weight:800}.grid input,.grid select,.grid textarea{width:100%;box-sizing:border-box;margin-top:6px;padding:11px;border:1px solid #3a3f49;border-radius:8px;background:#11141a;color:#fff}.wide{grid-column:1/-1}.actions{display:flex;gap:8px;margin-top:15px}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:900;cursor:pointer}.save{background:#d71920;color:#fff}.cancel{background:#292e37;color:#fff}.row{display:grid;grid-template-columns:110px 1fr 150px 170px;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #292e37}.row:last-child{border:0}.row small{color:#aeb4bf}.row button{margin-left:5px}.danger{background:#40191c;color:#ff9b9f}@media(max-width:760px){.grid,.row{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><header></header><main class="cms"><div class="top"><div><p class="eyebrow">FAR ADMIN</p><h1>Schedule</h1><p>Manage shows, presenters and broadcast times. Saved active shows appear in the website schedule and current-show display.</p></div><a class="back" href="admin-dashboard.html">← FAR Admin</a></div><div id="status" class="box">Checking access…</div><section id="app" hidden><form id="form" class="box"><input id="id" type="hidden"><div class="grid"><label>Days<select id="day"><option value="weekday">Weekdays</option><option value="saturday">Saturday</option><option value="sunday">Sunday</option></select></label><label>Start time<input id="start" type="time" required></label><label>Finish time<input id="end" type="time" required></label><label class="wide">Show name<input id="name" required maxlength="120"></label><label>Presenter<input id="presenter" maxlength="120"></label><label>Show image address or filename<input id="image" placeholder="fenland-angels-radio-logo.jpg"></label><label>Order<input id="order" type="number" value="10"></label><label class="wide">Short show introduction<input id="strap" maxlength="180"></label><label class="wide">Description<textarea id="description" rows="3"></textarea></label><label><input id="featured" type="checkbox"> Featured show</label><label><input id="active" type="checkbox" checked> Active</label></div><div class="actions"><button class="btn save" type="submit">Save show</button><button id="cancel" class="btn cancel" type="button">Clear form</button></div></form><div class="box"><h2>Current schedule</h2><div id="list"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="events-config.js"></script><script>
(async()=>{const cfg=window.FAR_EVENTS_CONFIG||{},status=document.getElementById('status'),app=document.getElementById('app');if(!cfg.SUPABASE_URL)return status.textContent='CMS not configured.';const db=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const {data:{session}}=await db.auth.getSession();if(!session){location.href='admin-dashboard.html';return}const {data:admin}=await db.from('far_admins').select('role,permissions').eq('user_id',session.user.id).maybeSingle();const role=(admin?.role||'').toLowerCase(),perms=Array.isArray(admin?.permissions)?admin.permissions:[];if(!admin||(!['owner','deputy_manager'].includes(role)&&!perms.includes('schedule'))){status.textContent='You do not have Schedule permission.';return}status.hidden=true;app.hidden=false;
const $=id=>document.getElementById(id),fields={id:$('id'),day:$('day'),start:$('start'),end:$('end'),name:$('name'),presenter:$('presenter'),image:$('image'),order:$('order'),strap:$('strap'),description:$('description'),featured:$('featured'),active:$('active')};let rows=[];
function clear(){fields.id.value='';fields.day.value='weekday';fields.start.value='';fields.end.value='';fields.name.value='';fields.presenter.value='';fields.image.value='fenland-angels-radio-logo.jpg';fields.order.value=10;fields.strap.value='';fields.description.value='';fields.featured.checked=false;fields.active.checked=true}
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function load(){const {data,error}=await db.from('far_schedule').select('*').order('day_group').order('sort_order');if(error){$('list').innerHTML='<p>'+esc(error.message)+'</p>';return}rows=data||[];$('list').innerHTML=rows.map(r=>'<div class="row"><strong>'+esc(r.start_time.slice(0,5))+'–'+esc(r.end_time.slice(0,5))+'</strong><div><b>'+esc(r.show_name)+'</b><br><small>'+esc(r.day_group)+(r.presenter?' • '+esc(r.presenter):'')+(r.active?'':' • INACTIVE')+'</small></div><small>'+esc(r.strapline||'')+'</small><div><button class="btn cancel" data-edit="'+r.id+'">Edit</button><button class="btn danger" data-del="'+r.id+'">Delete</button></div></div>').join('')||'<p>No schedule entries yet.</p>'}
$('list').addEventListener('click',async e=>{const edit=e.target.dataset.edit,del=e.target.dataset.del;if(edit){const r=rows.find(x=>String(x.id)===edit);fields.id.value=r.id;fields.day.value=r.day_group;fields.start.value=r.start_time.slice(0,5);fields.end.value=r.end_time.slice(0,5);fields.name.value=r.show_name;fields.presenter.value=r.presenter||'';fields.image.value=r.image||'';fields.order.value=r.sort_order;fields.strap.value=r.strapline||'';fields.description.value=r.description||'';fields.featured.checked=!!r.featured;fields.active.checked=!!r.active;scrollTo({top:0,behavior:'smooth'})}if(del&&confirm('Delete this show from the schedule?')){const {error}=await db.from('far_schedule').delete().eq('id',del);if(error)alert(error.message);else load()}});
$('form').addEventListener('submit',async e=>{e.preventDefault();const payload={day_group:fields.day.value,start_time:fields.start.value,end_time:fields.end.value,show_name:fields.name.value.trim(),presenter:fields.presenter.value.trim()||null,image:fields.image.value.trim()||null,sort_order:Number(fields.order.value)||0,strapline:fields.strap.value.trim()||null,description:fields.description.value.trim()||null,featured:fields.featured.checked,active:fields.active.checked,updated_at:new Date().toISOString()};let q=fields.id.value?db.from('far_schedule').update(payload).eq('id',fields.id.value):db.from('far_schedule').insert(payload);const {error}=await q;if(error)alert(error.message);else{clear();load()}});$('cancel').onclick=clear;clear();load()})();
</script></body></html>
