name: FAR Audience History

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Read StationHQ and Icecast and store audience snapshot
        shell: bash
        env:
          STATIONHQ_API_KEY: ${{ secrets.STATIONHQ_API_KEY }}
        run: |
          set -euo pipefail

          # StationHQ filtered listener count (read-only API key kept in GitHub Secrets).
          SHQ_JSON="$(curl -fsS --max-time 15             -H "Authorization: Bearer $STATIONHQ_API_KEY"             'https://hq3.yesstreaming.net/api/v1/station/40/stats')"
          SHQ_LISTENERS="$(printf '%s' "$SHQ_JSON" | python3 -c 'import json,sys; print(int(json.load(sys.stdin).get("listenerCount",0)))')"
          SHQ_STATUS="$(printf '%s' "$SHQ_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status","unknown"))')"

          # Raw Icecast connections. Failure is recorded as offline instead of losing the sample.
          ICE_ONLINE=true
          ICE_LISTENERS=0
          if HTML="$(curl -fsS --max-time 15 'https://hq3.yesstreaming.net:7085/status.xsl')"; then
            ICE_LISTENERS="$(printf '%s' "$HTML" | sed -nE 's/.*Current Listeners:<\/td><td[^>]*>([0-9]+).*/\1/p' | head -n1 || true)"
            if [ -z "$ICE_LISTENERS" ]; then
              ICE_LISTENERS="$(printf '%s' "$HTML" | grep -oE 'Current Listeners[^0-9]*[0-9]+' | grep -oE '[0-9]+' | head -n1 || true)"
            fi
            if [ -z "$ICE_LISTENERS" ]; then ICE_LISTENERS=0; ICE_ONLINE=false; fi
          else
            ICE_ONLINE=false
          fi

          curl -fsS --max-time 15             -X POST 'https://nkdjnrycpdiwburtkzen.supabase.co/rest/v1/far_icecast_snapshots'             -H 'apikey: sb_publishable_jswOUS7A8Uw3RqQXj3kxQw_dZaJYC_2'             -H 'Content-Type: application/json'             -H 'Prefer: return=minimal'             --data "{\"listeners\":$ICE_LISTENERS,\"mount\":\"/stream\",\"stream_online\":$ICE_ONLINE,\"stationhq_listeners\":$SHQ_LISTENERS,\"stationhq_status\":\"$SHQ_STATUS\"}"
