name: Update Fenland Angels Newsroom

on:
  workflow_dispatch:

  schedule:
    - cron: "45 0,6,12,18 * * *"
      timezone: "Europe/London"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Fenland Angels news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/update_news.py

      - name: Commit newsroom updates
        run: |
          git config user.name "Fenland Angels News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add news-data.json news.xml news-state.json
          git diff --cached --quiet || git commit -m "Update Fenland Angels newsroom"
          git push
