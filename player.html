<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Listen Live | Fenland Angels Radio</title>
<style>
:root{--red:#d71920;--red2:#ff3138;--gold:#d4aa47;--muted:#b8bcc5}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;padding:28px;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 20% 10%,#1a100d,#08090c 40%,#050608 80%);
  color:#fff;font-family:Arial,Helvetica,sans-serif
}
.player{
  width:100%;max-width:370px;padding:28px;text-align:center;
  border:1px solid #5b4520;border-radius:22px;
  background:linear-gradient(145deg,#0a0b0e,#101217);
  box-shadow:0 22px 70px rgba(0,0,0,.55)
}
.logo{width:150px;height:150px;border-radius:50%;object-fit:cover;border:3px solid var(--gold)}
.live{display:inline-block;margin-top:20px;padding:7px 11px;border-radius:7px;background:var(--red);font-weight:900}
h1{font-size:30px;margin:16px 0 6px}
p{color:var(--muted);line-height:1.5}
.play{
  width:76px;height:76px;border:0;border-radius:50%;
  background:linear-gradient(180deg,#ef2027,#b90f15);
  color:#fff;font-size:30px;cursor:pointer;margin:18px 0
}
.status{font-weight:800;margin-bottom:18px}
input{width:100%;accent-color:var(--red2)}
.small{font-size:12px;color:var(--muted);margin-top:16px}
.hours{margin-top:13px;padding:7px 10px;border:1px solid #5b4520;border-radius:9px;background:#11141a;color:var(--gold);font-size:11px;font-weight:900}.hours b{color:#fff;font-size:14px}
</style>
<link rel="stylesheet" href="live-player.css?v=1">
</head>
<body>
<div class="player">
  <img class="logo" src="fenland-angels-radio-logo.jpg" alt="Fenland Angels Radio">
  <div class="live">ON AIR</div>
  <h1>Fenland Angels Radio</h1>
  <p>The Sound of the Fens</p>
  <button id="play" class="play" type="button" aria-label="Play live radio">▶</button>
  <div id="status" role="status" aria-live="polite" class="status">Tap play to listen live</div>
  <input id="volume" type="range" min="0" max="1" step="0.01" value="0.85" aria-label="Volume">
  <div class="small">Live stream · MP3 320 kbps</div>
  <div class="hours">HOURS LISTENED TO FAR · <b id="farLifetimeHours">300.6</b></div>
  <audio id="radio" preload="none">
    <source src="https://hq3.yesstreaming.net/fenlandangelsradio/stream" type="audio/mpeg">
  </audio>
</div>
<script src="events-config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="far-analytics.js?v=13"></script>
<script src="player-audio.js?v=1"></script>
<script>
const audio=document.getElementById('radio');
const play=document.getElementById('play');
const status=document.getElementById('status');
const volume=document.getElementById('volume');
(function(){async function updateFarLifetime(){try{const cfg=window.FAR_EVENTS_CONFIG||{};if(!cfg.SUPABASE_URL||!cfg.SUPABASE_ANON_KEY)return;const r=await fetch(cfg.SUPABASE_URL+"/functions/v1/far-audience",{cache:"no-store",headers:{apikey:cfg.SUPABASE_ANON_KEY,Authorization:"Bearer "+cfg.SUPABASE_ANON_KEY}});if(!r.ok)return;const j=await r.json();const el=document.getElementById("farLifetimeHours");if(el&&Number.isFinite(Number(j.lifetime_hours)))el.textContent=Number(j.lifetime_hours).toLocaleString("en-GB",{minimumFractionDigits:1,maximumFractionDigits:1})}catch(e){}}updateFarLifetime();setInterval(updateFarLifetime,30000)})();
// Match the website and app's perceived-volume curve.
volume.addEventListener('input',()=>audio.volume=Number(volume.value) ** 2);
audio.volume=Number(volume.value) ** 2;
audio.addEventListener('playing',()=>{if(window.FARAnalytics) window.FARAnalytics.startListening('website')});
audio.addEventListener('pause',()=>{if(window.FARAnalytics) window.FARAnalytics.stopListening('website')});
audio.addEventListener('ended',()=>{if(window.FARAnalytics) window.FARAnalytics.stopListening('website')});
play.addEventListener('click',async()=>{
  if(audio.paused){
    try{
      if(window.FARPlayerAudio) await window.FARPlayerAudio.prepare(audio);
      audio.load();
      await audio.play();
      play.textContent='❚❚';
      status.textContent='Playing live';
    }catch(e){
      status.textContent='Unable to start stream — tap again';
    }
  }else{
    audio.pause();
    play.textContent='▶';
    status.textContent='Paused';
  }
});
audio.addEventListener('error',()=>{if(window.FARAnalytics) window.FARAnalytics.stopListening('website');play.textContent='▶';status.textContent='Stream temporarily unavailable — tap Play to reconnect'});
</script>
</body>
</html>
