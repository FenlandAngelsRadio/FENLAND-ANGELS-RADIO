<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAR Admin Inbox</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="site-nav.css?v=2"><link rel="stylesheet" href="events-system.css"><link rel="stylesheet" href="far-forms.css"><script src="site-nav.js?v=5" defer></script></head><body><header></header><main class="admin-hub"><section id="login" class="admin-box"><p class="eyebrow">FAR ADMIN</p><h1>Admin Inbox</h1><div class="far-field"><label>Email</label><input id="email" type="email"></div><div class="far-field" style="margin-top:12px"><label>Password</label><input id="password" type="password"></div><button id="signin" class="admin-btn" style="margin-top:16px">Sign in</button><div id="loginStatus" class="far-status"></div></section><section id="panel" hidden><h1 id="inboxTitle">Inbox</h1><p id="inboxHelp">Read messages and record your follow-up. Saving a status or note does not send a reply.</p><div class="filterbar"><a class="admin-btn" href="admin-dashboard.html">Dashboard</a><button class="filter" data-kind="all">All</button><button class="filter" data-kind="contact">Contact</button><button class="filter" data-kind="application">Applications</button><button class="filter" data-kind="advertising">Advertising</button></div><div id="list" class="inbox-grid"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="events-config.js"></script><script>
const c=window.FAR_EVENTS_CONFIG,sb=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY),L=document.getElementById("list"),P=document.getElementById("panel"),G=document.getElementById("login");let kind=new URLSearchParams(location.search).get("kind")||"all";let currentAccess=null;
const esc=v=>String(v??"").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]));
async function admin(u){if(!u)return null;const {data}=await sb.from("far_admins").select("display_name,role,permissions").eq("user_id",u.id).maybeSingle();if(!data)return null;const role=(data.role||"staff").toLowerCase(),perms=Array.isArray(data.permissions)?data.permissions:[];const needed=kind==="application"?"applications":kind==="advertising"?"advertising":kind==="contact"?"inbox":null;if(role==="owner"||role==="deputy_manager")return data;if(needed&&perms.includes(needed))return data;return null}
async function auth(){const {data:{session}}=await sb.auth.getSession();if(!session){G.hidden=false;P.hidden=true;return}currentAccess=await admin(session.user);if(!currentAccess){location.replace("admin-dashboard.html");return}G.hidden=true;P.hidden=false;const management=['owner','deputy_manager'].includes((currentAccess.role||'').toLowerCase()),permissions=currentAccess.permissions||[];document.querySelectorAll('.filter').forEach(button=>{const permission={contact:'inbox',application:'applications',advertising:'advertising'}[button.dataset.kind];button.hidden=button.dataset.kind==='all'?!management:!management&&!permissions.includes(permission)});load()}
document.getElementById("signin").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){loginStatus.textContent=error.message;loginStatus.className="far-status error"}else auth()};
document.querySelectorAll(".filter").forEach(b=>b.onclick=async()=>{kind=b.dataset.kind;const {data:{session}}=await sb.auth.getSession();currentAccess=session?await admin(session.user):null;if(!currentAccess){location.replace("admin-dashboard.html");return}load()});
function opts(k,s){const a=k==="application"?["new","reviewing","contacted","interview","accepted","rejected","closed"]:k==="advertising"?["new","contacted","quoted","won","lost","closed"]:["new","in_progress","replied","closed"];return a.map(x=>`<option ${x===s?"selected":""}>${x}</option>`).join("")}
async function load(){const name={all:'Inbox',contact:'Inbox',application:'Applications',advertising:'Advertising Enquiries'}[kind]||'Inbox';document.getElementById('inboxTitle').textContent=name;document.title=name+' | FAR Admin';let q=sb.from("inbox_items").select("*").order("created_at",{ascending:false});if(kind!=="all")q=q.eq("kind",kind);const {data,error}=await q;if(error){L.innerHTML=esc(error.message);return}L.innerHTML=(data||[]).map(i=>`<article class="inbox-card" data-id="${i.id}"><small>${esc(i.kind)} · ${new Date(i.created_at).toLocaleString("en-GB")}</small><h3>${esc(i.name||i.business_name||"Submission")}</h3><p><strong>Email:</strong> ${esc(i.email)}<br><strong>Phone:</strong> ${esc(i.phone)}</p>${i.subject?`<p><strong>Subject:</strong> ${esc(i.subject)}</p>`:""}${i.message?`<p>${esc(i.message)}</p>`:""}${i.role_type?`<p><strong>Role:</strong> ${esc(i.role_type)}<br><strong>Location:</strong> ${esc(i.location)}<br><strong>Availability:</strong> ${esc(i.availability)}<br><strong>Experience:</strong> ${esc(i.experience)}<br><strong>Why FAR:</strong> ${esc(i.why_join)}${i.demo_url?`<br><a href="${esc(i.demo_url)}" target="_blank">Demo / portfolio</a>`:""}</p>`:""}${i.business_name?`<p><strong>Business:</strong> ${esc(i.business_name)}<br><strong>Interested in:</strong> ${esc(i.package_interest)}<br><strong>Dates:</strong> ${esc(i.campaign_dates)}</p>`:""}<label>Status</label><select data-status>${opts(i.kind,i.status)}</select><label>Team notes</label><textarea data-notes>${esc(i.admin_notes)}</textarea><div class="actions"><button class="admin-btn" data-save>Save</button><a class="admin-btn" href="mailto:${encodeURIComponent(i.email)}">Email reply</a><button class="admin-btn danger" data-delete>Delete</button></div></article>`).join("")||"<p>Nothing here yet.</p>"}
L.onclick=async e=>{const card=e.target.closest(".inbox-card");if(!card)return;if(e.target.matches("[data-save]")){const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from("inbox_items").update({status:card.querySelector("[data-status]").value,admin_notes:card.querySelector("[data-notes]").value||null,reviewed_by:user.id,reviewed_at:new Date().toISOString()}).eq("id",card.dataset.id);if(error)alert(error.message);else alert("Saved.")}if(e.target.matches("[data-delete]")&&confirm("Permanently delete this submission?")){const {error}=await sb.from("inbox_items").delete().eq("id",card.dataset.id);if(error)alert(error.message);else load()}};
auth();
</script></body></html>
