<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fenland Angels">
<title>Fenland Angels Radio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header>
    <img class="wordmark" src="fenland-angels-radio-logo.jpg" alt="Fenland Angels Radio">
    <div class="brand">
      <strong>FENLAND <span>ANGELS</span> RADIO</strong>
      <small>INDEPENDENT MUSIC RADIO COMMUNITY</small>
    </div>
  </header>

  <section class="player-card">
    <div class="status"><i></i> ON AIR</div>
    <h1>Listen Live</h1>
    <p class="strap">The Sound of the Fens</p>

    <button id="playButton" class="play" type="button" aria-label="Play Fenland Angels Radio">
      <span id="playIcon">▶</span>
    </button>

    <div class="streamline">
      <span id="state">Tap play to listen live</span>
      <b>320 kbps</b>
    </div>

    <div class="volume-row">
      <span>🔊</span>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
    </div>

    <div class="now">
      <small>NOW PLAYING</small>
      <strong id="nowPlaying">Fenland Angels Radio</strong>
      <span>Independent Music • Local Voices • News • Weather</span>
    </div>
  </section>

  <nav>
    <a href="#player">▶<span>Player</span></a>
    <a href="https://fenlandangelsradio.github.io/FENLAND-ANGELS-RADIO/#shows">▣<span>Shows</span></a>
    <a href="https://fenlandangelsradio.github.io/FENLAND-ANGELS-RADIO/">⌂<span>Website</span></a>
  </nav>

  <button id="installButton" class="install" type="button">Install App</button>
  <p id="installHelp" class="help">On iPhone: Safari → Share → Add to Home Screen.</p>

  <audio id="radio" preload="none">
    <source src="https://ec5.yesstreaming.net:2190/stream" type="audio/mpeg">
  </audio>
</main>
<script src="app.js"></script>
</body>
</html>
