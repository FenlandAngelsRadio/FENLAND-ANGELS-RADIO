<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local News | Fenland Angels Radio</title><meta name="description" content="Local news briefs from Fenland Angels Radio — The Sound of the Fens."><link rel="stylesheet" href="assets/news.css"></head><body><main class="wrap"><header><p class="kicker">FENLAND ANGELS RADIO</p><h1>Local News Across the Fens</h1><p class="strap">The Sound of the Fens</p></header><section id="news" aria-live="polite"><p>Loading the latest local news…</p></section><footer><p>Fenland Angels Radio creates concise news briefs from public local-news sources. Follow the original-story link for the source report and full context.</p></footer></main><script>fetch('news-data.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{const box=document.getElementById('news'),stories=data.stories||[];if(!stories.length){box.innerHTML='<p>No newsroom stories have been generated yet.</p>';return;}box.innerHTML=stories.slice(0,20).map(s=>`<article class="story"><h2>${esc(s.headline)}</h2><p>${esc(s.brief).replace(/\n/g,'<br>')}</p><a href="${esc(s.original_url)}" target="_blank" rel="noopener">Read the original report</a></article>`).join('');}).catch(()=>document.getElementById('news').innerHTML='<p>News is temporarily unavailable.</p>');function esc(s=''){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}</script></body></html>
